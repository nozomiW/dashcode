[project]
name = "dashcode"
version = "0.1.0"
description = "DashCode: 终端 AI 编程助手"
requires-python = ">=3.12"
dependencies = [
  "textual>=0.80",
  "rich>=13",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyyaml>=6",
]

[project.scripts]
dashcode = "dashcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashcode"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
